<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - QR PhotoShare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen text-gray-800">
    <nav class="bg-white shadow-sm border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <a href="/" class="text-2xl font-extrabold bg-gradient-to-r from-blue-600 to-emerald-500 bg-clip-text text-transparent">QR PhotoShare</a>
                <div class="hidden md:flex space-x-8">
                    <a href="/" class="text-gray-500 hover:text-blue-600 transition">Home</a>
                    <a href="/about.html" class="text-gray-500 hover:text-blue-600 transition">About Us</a>
                    <a href="/contact.html" class="text-blue-600 font-medium">Contact</a>
                </div>
            </div>
        </div>
    </nav>
    <main class="flex-grow max-w-4xl mx-auto px-4 py-12 w-full">
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
            <h1 class="text-3xl font-bold text-gray-900 mb-6 text-center">Contact Us</h1>
            <p class="text-center text-gray-600 mb-8">Have questions, feedback, or need support? We'd love to hear from you!</p>
            
            <form class="max-w-md mx-auto space-y-4" onsubmit="event.preventDefault(); alert('Message sent successfully!');">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Name</label>
                    <input type="text" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Email</label>
                    <input type="email" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Message</label>
                    <textarea required rows="4" class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"></textarea>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700 transition">Send Message</button>
            </form>
        </div>
    </main>
    <footer class="bg-white border-t border-gray-200 mt-auto pt-8 pb-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <p class="text-sm text-gray-400">&copy; 2026 QR PhotoShare. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
